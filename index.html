<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tofas Avcısı 🚙</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tofaş Avcısı 🚙</h1>
    <p>Kayra malini mavi Tofasina ulastir, puan kazan!</p>

    <div id="score">Puan: 0</div>

    <div id="game">
        <div id="player">
            <img src="kayra2.png" alt="Kayra">
        </div>

        <div id="star">🚙</div>
    </div>

    <p id="instructions">Bilgisayarinda ok tuslarini telefonda asagidaki tuslari kullan!</p>

    <div id="controls">
        <button data-direction="up" aria-label="Yukarı">⬆️</button>
        <div class="horizontal-controls">
            <button data-direction="left" aria-label="Sol">⬅️</button>
            <button data-direction="down" aria-label="Aşağı">⬇️</button>
            <button data-direction="right" aria-label="Sağ">➡️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
